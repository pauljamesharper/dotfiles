# Colours live in theme.toml, which desk-theme rewrites; Alacritty reloads it live.
[general]
import = ["~/.config/alacritty/theme.toml"]
live_config_reload = true

[window]
padding = { x = 10, y = 8 }
dynamic_padding = true
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 14.67

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# Alacritty runs in the emacs distrobox (no host package), so hop out to a
# shell on the host; run directly on a host, it just starts bash.
[terminal.shell]
program = "/bin/sh"
args = ["-c", "if [ -e /run/.containerenv ]; then exec distrobox-host-exec bash -l; else exec bash -l; fi"]
